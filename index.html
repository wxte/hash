<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f4"><title>PRL / Quantus 挖矿收益对比</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="/">PRL / QTC 收益对比</a><div class="live"><span id="status-pill" class="status-pill">等待数据</span><span id="refresh-label">正在读取</span><button id="refresh" title="立即刷新" aria-label="刷新数据">↻</button></div></header>
    <p class="notice" id="data-notice" role="status" hidden></p>
    <section class="controls panel"><div class="control-head"><div><h2>计算设置</h2></div><button class="text-button" id="reset-settings">恢复默认</button></div><div class="settings-grid">
      <label>电价 <span><input id="electricity" type="number" min="0" step="0.001"> <b>元/度</b></span></label>
      <div class="fx-control">自动汇率 <div id="fx">正在获取…</div><small id="fx-time"></small><a id="fx-attribution" href="https://www.exchangerate-api.com" hidden>Rates By Exchange Rate API</a></div>
    </div></section>
    <section class="summary-grid" id="coin-summary"></section>
    <section class="panel table-panel"><div class="table-heading"><div><h2>显卡收益 / 天（元）</h2></div><div class="legend"><span><i class="dot now"></i>实时 / 天</span><span><i class="dot avg"></i>24h 平均 / 天</span></div></div>
      <div class="table-wrap"><table><thead><tr><th>显卡 <small>点击算力和功耗可编辑</small></th><th>PRL 实时 <small>毛收益 / 净收益</small></th><th>PRL 24h 平均 <small>毛收益 / 净收益</small></th><th>QTC 实时 <small>毛收益 / 净收益</small></th><th>QTC 24h 平均 <small>毛收益 / 净收益</small></th><th>当前更高</th></tr></thead><tbody id="cards"></tbody></table></div>
      <div class="table-foot"><span>算力与功耗为参考预设，请按矿机实测调整。</span><span>24h 平均按有效样本覆盖时间加权，缺失区间不补零，按最新汇率折算人民币。</span></div>
    </section>
    <footer><span>约每 10 分钟采集 · PearlSonar / QTCScan / CoinGecko</span><span id="updated">尚未更新</span></footer>
  </main>
  <div id="toast" role="status"></div><script type="module" src="/app.js"></script>
</body></html>
