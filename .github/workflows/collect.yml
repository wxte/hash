name: Collect mining market snapshots
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-market
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect PRL and Quantus snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$COLLECT_SECRET" ]; then
            echo 'Configure SITE_URL and COLLECT_SECRET in repository Actions secrets.'
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 65 \
            --retry 1 --retry-delay 5 \
            -H "Authorization: Bearer $COLLECT_SECRET" \
            "$SITE_URL/api/collect"
