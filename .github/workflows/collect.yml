name: Collect mining market snapshots
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-market
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect PRL and Quantus snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: node .github/scripts/collect.mjs
